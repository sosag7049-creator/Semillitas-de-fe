name: Semillitas v2

on:
  push:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/semillitas-v2.yml"
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/semillitas-v2.yml"

defaults:
  run:
    working-directory: v2

jobs:
  verify:
    name: Lint · Tipos · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Build de producción
        run: npm run build
